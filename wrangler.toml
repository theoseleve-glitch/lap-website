# T096 — Cloudflare Pages project config. The repo's first
# wrangler.toml; lands as a stub today and lights up at deploy
# when T008 (Cloudflare Pages project linked to repo) unblocks.
#
# `name` and `compatibility_date` are required by Wrangler v3+;
# `pages_build_output_dir` matches Astro's `dist/` build output
# (locked by astro.config.mjs); `compatibility_flags` enables
# nodejs_compat for any std-lib touch the Pages Functions need
# (current functions/_lib/waitlist-token.ts uses Web Crypto only,
# but the flag is cheap insurance against future imports).
#
# NOTE (2026-07-01): the waitlist-drip cron ([[triggers]]) was removed. The
# Cloudflare Pages git build (wrangler) rejects a `triggers` field in Pages
# config ("does not support triggers"), which failed the build and blocked the
# launch from being git-durable. The waitlist is retired at launch
# (/founding → /pricing), so the daily drip cron is obsolete. The scheduled
# handler functions/_scheduled/waitlist-drip.ts remains in the repo; re-add its
# cron via the Cloudflare dashboard (Workers & Pages → lap-website → Settings)
# if drip is ever needed again.

name = "lap-website"
pages_build_output_dir = "./dist"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
